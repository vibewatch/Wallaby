name: Deploy VM

on:
  workflow_run:
    workflows: ["release-gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wallaby-production
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main'
      && (
        github.event_name == 'workflow_dispatch'
        || (
          vars.VM_DEPLOY_ENABLED == 'true'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      image: ghcr.io/huangyingting/wallaby@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Require a successful release gate for this commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          commit=$(git rev-parse HEAD)
          passed=$(gh run list --workflow release.yml --commit "$commit" --status success --event push --limit 1 --json databaseId --jq length)
          test "$passed" = 1 || { echo "This commit has not passed release-gate" >&2; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/huangyingting/wallaby:${{ steps.source.outputs.commit }}
          build-args: DEPLOYMENT_VERSION=${{ steps.source.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://wallaby.genisisiq.com
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy web, worker, and persistent storage
        env:
          DEPLOY_COMMIT: ${{ needs.build.outputs.commit }}
          DEPLOY_IMAGE: ${{ needs.build.outputs.image }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME }}
          APPLICATION_ENV: ${{ secrets.VM_APP_ENV }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: node scripts/deploy-vm.mjs
      - name: Verify public HTTPS endpoints
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --max-time 15 https://wallaby.genisisiq.com/api/health/ready
          curl --fail --silent --show-error --max-time 15 https://wallaby.genisisiq.com/api/health/live
          curl --fail --silent --show-error --max-time 15 --output /dev/null https://wallaby.genisisiq.com/auth/signin
